[package]
name = "beast-app"
version = "0.1.0"
edition = "2021"
description = "兽音译者安卓 app（纯 Rust，eframe/egui）"
license = "AGPL-3.0-or-later"

[lib]
name = "beast_app"
crate-type = ["cdylib", "rlib"]

[dependencies]
beast-core = { path = "../beast-core" }
eframe = "0.31"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", features = ["android-game-activity"] }
winit = { version = "0.30", features = ["android-game-activity"] }
# 版本必须与 winit 内部依赖一致，否则会出现两个 AndroidApp 类型
android-activity = { version = "0.6", features = ["game-activity"] }
android_logger = "0.14"
log = "0.4"
jni = "0.22"
